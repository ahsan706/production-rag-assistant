name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Settings reads these at import time. Tests are hermetic (httpx monkeypatched),
      # so the URLs do not need to point at real services.
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      OLLAMA_BASE_URL: http://localhost:11434
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4 mypy==1.13.0

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (advisory)
        # Existing code is partially typed. Soft gate; tighten over time.
        continue-on-error: true
        run: mypy app

      - name: Pytest
        run: python -m pytest -q

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build
