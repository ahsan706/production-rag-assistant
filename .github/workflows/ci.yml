name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Settings reads these at import time. Tests are hermetic (httpx monkeypatched),
      # so the URLs do not need to point at real services.
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      OLLAMA_BASE_URL: http://localhost:11434
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies (runtime + dev)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (advisory)
        # Existing code is partially typed. Soft gate; tighten over time.
        continue-on-error: true
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest -q

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build
